name: Refresh data and publish site

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 06:30 Malaysia time (Tue-Sat), after the NY close
    - cron: "0 13 * * 1-5"    # 21:00 Malaysia time (Mon-Fri), picks up FRED's morning updates
  workflow_dispatch:          # "Run workflow" button, also in the GitHub mobile app
  push:
    branches: [main]
    paths: ["site/**", "build_site.py", "ust_dash/**", "config.py", ".github/workflows/refresh.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas numpy requests

      - name: Build site/data.json
        run: python build_site.py

      # Keeps a daily history in git, and the activity stops GitHub from
      # pausing the schedule after 60 quiet days.
      - name: Commit data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "Refresh market data"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
